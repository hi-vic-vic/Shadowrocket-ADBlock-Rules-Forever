name: Merge ad-block rules

# 每天北京时间 08:00 从 johnshall/Shadowrocket-ADBlock-Rules-Forever 的 release
# 拉取最新黑名单、白名单配置，保留其中的代理/直连规则，换成 dist/ 里的广告引用。
# 内容没有变化时不产生空提交。
on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: merge-adblock-${{ github.ref }}
  cancel-in-progress: false

jobs:
  merge:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Regenerate merged rules
        run: python3 scripts/merge_adblock.py

      - name: Commit when content changed
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No content changes."
            exit 0
          fi
          git commit -m "chore: regenerate merged ad-block rules"
          git push
