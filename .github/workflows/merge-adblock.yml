name: Merge ad-block rules

# 每天北京时间 08:00 重新拉取上游黑/白名单和外部广告名单，合并后写回 release。
# 内容没有变化时不产生空提交。
on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: merge-adblock-${{ github.ref }}
  cancel-in-progress: false

jobs:
  merge:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Regenerate merged rules
        run: python3 scripts/merge_adblock.py

      - name: Commit when content changed
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No content changes."
            exit 0
          fi
          git commit -m "chore: regenerate merged ad-block rules"
          git push
