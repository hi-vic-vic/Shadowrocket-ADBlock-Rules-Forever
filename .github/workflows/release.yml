name: Upstream release (disabled on fork)

# johnshall 原来的 release 工作流会 checkout build 分支，再 force-push 到 release。
# 这个 fork 没有 build 分支，也没有上游构建用的密钥。原样启用会在 Actions 里失败，
# force-push 还会冲掉合并后的广告规则。
# 每日更新改由 merge-adblock.yml 负责。此工作流只保留手动入口，并且什么都不改。

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  disabled:
    runs-on: ubuntu-latest
    steps:
      - name: Explain
        run: |
          echo "Upstream release workflow is disabled on this fork."
          echo "Merged ad-block rules are built by .github/workflows/merge-adblock.yml."
